[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[project]
name = "lainlab"
version = "0.1.0"
description = "LainLab: multi-vendor robot learning, simulation validation, and deployment tools for mjlab 1.6"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = "Apache-2.0"
authors = [{ name = "The LainLab Developers" }]
keywords = ["mujoco", "mjlab", "reinforcement-learning", "robotics", "robot-learning"]
dependencies = ["mjlab==1.6.0"]

[project.urls]
Repository = "https://github.com/Lain-Ego0/LainLab"

[project.scripts]
train = "src.cli:train"
play = "src.cli:play"
list-envs = "src.cli:list_envs"
baseline-play = "src.cli:play_baseline"
src-train = "src.cli:train"
src-play = "src.cli:play"
src-list-envs = "src.cli:list_envs"
csv-to-npz = "src.cli:csv_to_npz"
gmr-to-npz = "src.cli:gmr_to_npz"
webui = "src.webui:main"
src-webui = "src.webui:main"
src-workbench = "src.workbench.server:main"
opendoge-calibrate = "src.toolchain.calibrate:main"
opendoge-eval = "src.toolchain.evaluate:main"
opendoge-collect = "src.toolchain.collect:main"
opendoge-bc = "src.toolchain.bc:main"
opendoge-dagger = "src.toolchain.dagger:main"
opendoge-export = "src.toolchain.export:main"

[dependency-groups]
dev = [
  "pre-commit>=4.3.0",
  "pyright>=1.1.408",
  "pytest>=9.0.3",
  "ruff>=0.16.1",
]

[project.optional-dependencies]
workbench = ["mink>=0.0.13", "daqp>=0.6", "tensorboard>=2.16", "onnx>=1.16", "setuptools<81"]
cu128 = ["torch>=2.7.0"]
cpu = ["torch>=2.7.0"]

[tool.uv]
conflicts = [[{ extra = "cu128" }, { extra = "cpu" }]]

[[tool.uv.index]]
url = "https://pypi.org/simple"

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cu128", extra = "cu128", marker = "sys_platform != 'darwin'" },
  { index = "pytorch-cpu", extra = "cpu", marker = "sys_platform != 'darwin'" },
]

[tool.ruff]
src = ["src"]
line-length = 88
indent-width = 2

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
ignore = ["B011"]

[tool.pyright]
pythonVersion = "3.10"
venvPath = "."
venv = ".venv"
include = ["src", "tests"]
stubPath = "typings"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.build-backend]
module-root = "."
module-name = "src"
source-exclude = ["src/workbench/viewer/node_modules/**"]
wheel-exclude = ["src/workbench/viewer/node_modules/**"]
